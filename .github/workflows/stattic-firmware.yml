# SPDX-License-Identifier: GPL-3.0-only
# Build the STATTIC FM-1 firmware package in the cloud and offer it as a download
# (Actions run > Artifacts). Same pinned JieLi compiler and checked SDK files as codex/cloud-build.
name: STATTIC firmware

on:
  push:
    branches: ['claude/**', 'codex/stattic-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stattic-fw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tool locations
        run: |
          echo "JIELI_TOOLCHAIN=$RUNNER_TEMP/jieli/toolchain" >> "$GITHUB_ENV"
          echo "AC79_SDK=$RUNNER_TEMP/ac79" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python build dependencies
        run: python -m pip install Pillow==13.0.0 fonttools==4.61.1
      - name: Pinned and verified JieLi compiler
        run: bash tools/cloud_toolchain.sh "$RUNNER_TEMP/jieli"
      - name: Checked AC79 SDK files
        run: python tools/cloud_sdk.py "$AC79_SDK"
      - name: Firmware (STATTIC)
        run: mkdir -p build && python tools/build.py --stattic 2>&1 | tee build/stattic-build.log
      - name: STATTIC host checks (C)
        run: |
          python tools/gen_tables.py build/gen/felucca_tables.h >/dev/null
          cc -O2 -w -fwrapv -Ibuild/gen -Ifirmware/src -Ifirmware/hal tests/stattic_mix_test.c -lm -lpthread -o build/stattic_mix
          for m in 1 2; do CORES=$m build/stattic_mix; done
          python tests/stattic_engine_vectors.py
          python tests/stattic_fx_vectors.py
      - name: Firmware package
        uses: actions/upload-artifact@v4
        with:
          name: stattic-firmware-${{ github.sha }}
          path: |
            build/*.fwsc
            build/stattic-build.json
            build/stattic-build.log
          retention-days: 30
          if-no-files-found: error

  # Every new firmware goes onto the site's install page (the owner installs from there):
  # the package, its manifest and install/config.json on gh-pages, then the Pages deployment.
  publish:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    concurrency:
      group: stattic-site-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stattic-firmware-${{ github.sha }}
          path: fw
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Firmware onto the install page
        env:
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          fw, site = Path('fw'), Path('site/snow')
          trace = json.loads((fw / 'stattic-build.json').read_text())
          pkg = fw / trace['package']
          digest = hashlib.sha256(pkg.read_bytes()).hexdigest()
          assert digest == trace['package_sha256'], 'package differs from its build record'
          short = os.environ['SHA'][:7]
          name = pkg.stem + '-' + short + pkg.suffix
          out = site / 'firmware'
          for old in out.glob(pkg.stem + '-*' + pkg.suffix):   # earlier builds of this line (not the original)
              old.unlink()
          shutil.copy(pkg, out / name)
          trace = dict(trace, package=name, branch=os.environ['BRANCH'])
          (out / 'manifest.json').write_text(json.dumps(trace, indent=2) + '\n')
          label = trace['version'] + ' · ' + short
          (site / 'install/config.json').write_text(json.dumps({
              'version': label, 'product': trace['product'], 'sha256': digest,
              'package': '../firmware/' + name, 'source_commit': trace['source_commit']}, indent=2) + '\n')
          status = site / 'hardware-status.json'
          st = json.loads(status.read_text()) if status.exists() else {}
          st.update(version=label, source_commit=trace['source_commit'], source_dirty=trace['source_dirty'],
                    hardware_audio_validation='pending')
          status.write_text(json.dumps(st, indent=2) + '\n')
          print('published', name, digest)
          PY
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A snow
          git commit -m "Install page: STATTIC firmware ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}" || exit 0
          git push origin HEAD:gh-pages
      - name: Deploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-simulator.yml --ref main -R "$GITHUB_REPOSITORY"
