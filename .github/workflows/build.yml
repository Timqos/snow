# SPDX-License-Identifier: GPL-3.0-only
name: Snow firmware and simulator

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_pages:
        description: 'Publish the checked simulator to GitHub Pages (Pages must use GitHub Actions)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: snow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      JIELI_TOOLCHAIN: ${{ runner.temp }}/snow-jieli/toolchain
      AC79_SDK: ${{ runner.temp }}/snow-ac79
      EMU_PREVIEW: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python build dependencies
        run: python -m pip install Pillow==13.0.0 fonttools==4.61.1
      - name: Pinned and verified JieLi compiler
        run: bash tools/cloud_toolchain.sh "$RUNNER_TEMP/snow-jieli"
      - name: Checked AC79 SDK files
        run: python tools/cloud_sdk.py "$AC79_SDK"
      - name: Emscripten 3.1.64
        run: |
          git clone --depth 1 --branch 3.1.64 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/snow-emsdk"
          "$RUNNER_TEMP/snow-emsdk/emsdk" install 3.1.64
          "$RUNNER_TEMP/snow-emsdk/emsdk" activate 3.1.64
          echo "$RUNNER_TEMP/snow-emsdk" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/snow-emsdk/upstream/emscripten" >> "$GITHUB_PATH"
      - name: Firmware, host tests, WebAssembly and site
        run: bash tools/cloud_build.sh
      - name: Build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snow-build-logs-${{ github.sha }}
          path: |
            build/*-build.log
            build/host-tests.log
            build/ui_new/report.txt
          if-no-files-found: ignore
      - name: Downloadable firmware and simulator
        uses: actions/upload-artifact@v4
        with:
          name: snow-firmware-and-simulator-${{ github.sha }}
          path: build/site/
          retention-days: 30
          if-no-files-found: error
      - name: Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site/

  publish:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish_pages) ||
       (github.event_name == 'push' && vars.SNOW_PUBLISH_PAGES == 'true'))
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the checked simulator
        id: deployment
        uses: actions/deploy-pages@v4
